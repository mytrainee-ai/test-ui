name: Test and deploy

on:
  pull_request:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest -q test_local test_auth test_app
      - name: Verify application startup
        run: |
          set -euo pipefail
          python -m compileall -q app.py auth_service.py config.py markdown_renderer.py pdf_utils.py schemas.py vision_service.py
          python -m pip check
          python -m streamlit run app.py --server.address 127.0.0.1 --server.port 8501 --server.headless true --server.fileWatcherType none > /tmp/streamlit.log 2>&1 &
          streamlit_pid=$!
          python -m uvicorn auth_service:app --host 127.0.0.1 --port 8001 --no-access-log > /tmp/auth.log 2>&1 &
          auth_pid=$!
          trap 'kill "$streamlit_pid" "$auth_pid" 2>/dev/null || true' EXIT
          for attempt in {1..20}; do
            if curl -fs --max-time 2 http://127.0.0.1:8501/_stcore/health > /dev/null \
              && curl -fs --max-time 2 http://127.0.0.1:8001/auth/login > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/streamlit.log /tmp/auth.log
          exit 1

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: test
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: math-page-production
      cancel-in-progress: false
    steps:
      - name: Connect to server and deploy tested commit
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          REVISION: ${{ github.sha }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_SSH_KEY"
          install -m 700 -d "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' '77.232.129.164 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIIPAe9YtSYS3zXkHPH2Ds9Yhy3pv5MF+302+uXmCuu62' > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"
          ssh -o BatchMode=yes -o StrictHostKeyChecking=yes -i "$HOME/.ssh/id_ed25519" \
            mathdeploy@77.232.129.164 /usr/local/bin/math-page-deploy "$REVISION"
